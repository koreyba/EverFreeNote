sonar.projectKey=koreyba_EverFreeNote
sonar.organization=koreyba
sonar.projectName=EverFreeNote
sonar.sourceEncoding=UTF-8

# Keep CI-based static analysis close to the previous Automatic Analysis scope.
# Test inclusions are automatically excluded from the production-source set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,cypress/**,**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,**/*.spec.js,**/*.spec.jsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/build/**,**/out/**,ui/shell/www/**,ui/shell/android/**,coverage/**,allure-report/**,allure-results/**,.nyc_output/**,.scannerwork/**,.worktrees/**

# Root Jest, Cypress, and mobile Jest own coverage for the product code. Other
# production areas remain statically analyzed but do not dilute this metric
# until they have a dedicated coverage producer.
# ui/shell/scripts holds build orchestration, like the root scripts/ directory above it.
# The two helpers in it that carry real logic — nativeProject.js and supabaseEnv.js — are
# unit tested and deliberately left in. app/perf-harness is on-device measurement tooling,
# compiled out of normal builds by NEXT_PUBLIC_ENABLE_PERF_HARNESS.
sonar.coverage.exclusions=supabase/**,scripts/**,db_audit_scripts/**,extensions/**,cypress/**,tests/**,**/tests/**,**/*.config.js,**/*.config.cjs,**/*.config.mjs,**/*.config.ts,**/*.d.ts,ui/shell/scripts/add-android.js,ui/shell/scripts/build-apk.js,ui/shell/scripts/build-web.js,ui/shell/scripts/generate-assets.js,ui/shell/scripts/cdp.js,ui/shell/scripts/make-harness-www.js,ui/shell/scripts/localBin.js,app/perf-harness/**

sonar.typescript.tsconfigPaths=tsconfig.json,core/tsconfig.json,ui/mobile/tsconfig.json
sonar.javascript.node.maxspace=8096
