name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: # Specify your branches here
      - main # The 'main' branch
      - 'releases/*' # The release branches

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}  # use PR head when available, otherwise current commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/mobile/package-lock.json
      - name: Install Node.js dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix ui/mobile ci --ignore-scripts
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891
        with:
          pr-mode: false
          args: --baseline baseline.sarif.json
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1215262580 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
