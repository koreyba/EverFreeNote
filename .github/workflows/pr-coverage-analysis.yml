name: PR coverage analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: pr-coverage-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Unit tests with coverage
    uses: ./.github/workflows/unit-tests.yml
    with:
      coverage: true
    secrets: inherit

  component-coverage:
    name: Cypress component tests with coverage
    uses: ./.github/workflows/component-tests.yml
    with:
      coverage: true
    secrets: inherit

  sonarqube-pr:
    name: SonarQube PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/sonar-pr.yml
    secrets: inherit

  qodana-pr:
    name: Qodana PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/qodana-pr.yml
    secrets: inherit
