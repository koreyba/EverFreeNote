name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-coverage-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Run Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    with:
      coverage: true
      publish_allure: false
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write

  component-coverage:
    name: Run Component Tests
    uses: ./.github/workflows/component-tests.yml
    with:
      coverage: true
      publish_allure: false
    secrets:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_TEST_AUTH_EMAIL: ${{ secrets.NEXT_PUBLIC_TEST_AUTH_EMAIL }}
      NEXT_PUBLIC_TEST_AUTH_PASSWORD: ${{ secrets.NEXT_PUBLIC_TEST_AUTH_PASSWORD }}
      NEXT_PUBLIC_SKIP_AUTH_EMAIL: ${{ secrets.NEXT_PUBLIC_SKIP_AUTH_EMAIL }}
      NEXT_PUBLIC_SKIP_AUTH_PASSWORD: ${{ secrets.NEXT_PUBLIC_SKIP_AUTH_PASSWORD }}
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write

  allure-publish:
    name: Publish PR Allure report
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/allure-pr-publish.yml
    with:
      family_outcome: >-
        ${{ needs.unit-coverage.result == 'success' && needs.component-coverage.result == 'success' && 'success' || 'failure' }}
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write

  allure-status-comment:
    name: Update Allure Report Link
    needs: allure-publish
    if: >-
      always() &&
      needs.allure-publish.result == 'success' &&
      needs.allure-publish.outputs.has_results == 'true' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/pr-status-comment.yml
    with:
      allure_url: ${{ needs.allure-publish.outputs.report_url }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

  unit-status-comment:
    name: Update Unit Test Status
    needs: unit-coverage
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/pr-status-comment.yml
    with:
      status_key: unit
      status: ${{ needs.unit-coverage.result }}
    permissions:
      contents: read
      issues: write
      pull-requests: write

  sonarqube-pr:
    name: SonarQube PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/sonar-pr.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      actions: read
      contents: read

  qodana-pr:
    name: Qodana PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/qodana-pr.yml
    secrets:
      QODANA_TOKEN_1215262580: ${{ secrets.QODANA_TOKEN_1215262580 }}
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write

  codacy-pr:
    name: Codacy PR coverage
    needs: [unit-coverage, component-coverage]
    if: >-
      needs.unit-coverage.result == 'success' &&
      needs.component-coverage.result == 'success' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download core Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-core-${{ github.run_id }}
          path: coverage/jest/core

      - name: Download web Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-web-${{ github.run_id }}
          path: coverage/jest/web

      - name: Download mobile Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-mobile-${{ github.run_id }}
          path: coverage/jest/mobile

      - name: Download Cypress coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-component-${{ github.run_id }}
          path: coverage/component

      - name: Verify Codacy LCOV inputs
        run: |
          set -euo pipefail
          test -s coverage/jest/core/lcov.info
          test -s coverage/jest/web/lcov.info
          test -s coverage/jest/mobile/lcov.info
          test -s coverage/component/lcov.info

      - name: Download and verify Codacy reporter
        env:
          CODACY_REPORTER_VERSION: 14.1.3
        run: |
          set -euo pipefail
          reporter_dir="$RUNNER_TEMP/codacy-reporter/$CODACY_REPORTER_VERSION"
          reporter_name=codacy-coverage-reporter-linux
          mkdir -p "$reporter_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            -o "$reporter_dir/$reporter_name" \
            "https://artifacts.codacy.com/bin/codacy-coverage-reporter/$CODACY_REPORTER_VERSION/$reporter_name"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 \
            -o "$reporter_dir/$reporter_name.SHA512SUM" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/$CODACY_REPORTER_VERSION/$reporter_name.SHA512SUM"
          (cd "$reporter_dir" && sha512sum --check "$reporter_name.SHA512SUM")
          chmod +x "$reporter_dir/$reporter_name"

      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/codacy-reporter/14.1.3/codacy-coverage-reporter-linux" report \
            --api-token "$CODACY_API_TOKEN" \
            --organization-provider gh \
            --username koreyba \
            --project-name EverFreeNote \
            --commit-uuid "${{ github.event.pull_request.head.sha }}" \
            -r coverage/jest/core/lcov.info \
            -r coverage/jest/web/lcov.info \
            -r coverage/jest/mobile/lcov.info \
            -r coverage/component/lcov.info

  component-status-comment:
    name: Update Component Test Status
    needs: component-coverage
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/pr-status-comment.yml
    with:
      status_key: component
      status: ${{ needs.component-coverage.result }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
