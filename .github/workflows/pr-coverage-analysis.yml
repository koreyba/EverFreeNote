name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-coverage-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Run Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    with:
      coverage: true
      publish_allure: false
    secrets: inherit

  component-coverage:
    name: Run Component Tests
    uses: ./.github/workflows/component-tests.yml
    with:
      coverage: true
      publish_allure: false
    secrets: inherit

  allure-publish:
    name: Publish PR Allure report
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/allure-pr-publish.yml
    with:
      family_outcome: >-
        ${{ needs.unit-coverage.result == 'success' && needs.component-coverage.result == 'success' && 'success' || 'failure' }}
    secrets: inherit

  sonarqube-pr:
    name: SonarQube PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/sonar-pr.yml
    secrets: inherit

  qodana-pr:
    name: Qodana PR analysis
    needs: [unit-coverage, component-coverage]
    if: >-
      always() &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/qodana-pr.yml
    secrets: inherit
