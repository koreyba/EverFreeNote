name: Codacy coverage

on:
  workflow_run:
    workflows:
      - Main coverage analysis
      - PR Tests
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: codacy-coverage-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  codacy-main:
    name: Upload main coverage to Codacy
    if: >-
      github.event.workflow_run.name == 'Main coverage analysis' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Jest coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jest-coverage-${{ github.event.workflow_run.id }}
          path: coverage/jest
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Cypress coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: component-coverage-${{ github.event.workflow_run.id }}
          path: coverage/component
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mobile Jest coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mobile-coverage-${{ github.event.workflow_run.id }}
          path: ui/mobile/coverage
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Codacy LCOV inputs
        run: |
          set -euo pipefail
          test -s coverage/jest/lcov.info
          test -s coverage/component/lcov.info
          test -s ui/mobile/coverage/lcov.info

      - name: Download and verify Codacy reporter
        env:
          CODACY_REPORTER_VERSION: 14.1.3
        run: |
          set -euo pipefail
          reporter_dir="$RUNNER_TEMP/codacy-reporter/$CODACY_REPORTER_VERSION"
          reporter_name=codacy-coverage-reporter-linux
          mkdir -p "$reporter_dir"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$reporter_dir/$reporter_name" \
            "https://artifacts.codacy.com/bin/codacy-coverage-reporter/$CODACY_REPORTER_VERSION/$reporter_name"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$reporter_dir/$reporter_name.SHA512SUM" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/$CODACY_REPORTER_VERSION/$reporter_name.SHA512SUM"
          (cd "$reporter_dir" && sha512sum --check "$reporter_name.SHA512SUM")
          chmod +x "$reporter_dir/$reporter_name"

      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/codacy-reporter/14.1.3/codacy-coverage-reporter-linux" report \
            --api-token "$CODACY_API_TOKEN" \
            --organization-provider gh \
            --username koreyba \
            --project-name EverFreeNote \
            --commit-uuid "$CODACY_COMMIT_SHA" \
            -r coverage/jest/lcov.info \
            -r coverage/component/lcov.info \
            -r ui/mobile/coverage/lcov.info

  codacy-pr:
    name: Upload PR coverage to Codacy
    if: >-
      github.event.workflow_run.name == 'PR Tests' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.repo.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate pull request head SHA
        id: pull-request-context
        env:
          WORKFLOW_RUN_JSON: ${{ toJson(github.event.workflow_run) }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const run = JSON.parse(process.env.WORKFLOW_RUN_JSON)
          const pullRequest = run.pull_requests?.[0]
          const sha = pullRequest?.head?.sha
          const expectedRepository = process.env.EXPECTED_REPOSITORY
          const headRepository = pullRequest?.head?.repo?.full_name
          const baseRepository = pullRequest?.base?.repo?.full_name

          if (!sha || headRepository !== expectedRepository || baseRepository !== expectedRepository) {
            throw new Error('The completed PR workflow did not pass the repository and head SHA validation.')
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\n`)
          NODE

      - name: Download core Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-core-${{ github.event.workflow_run.id }}
          path: coverage/jest/core
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-web-${{ github.event.workflow_run.id }}
          path: coverage/jest/web
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download mobile Jest coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-mobile-${{ github.event.workflow_run.id }}
          path: coverage/jest/mobile
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Cypress coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pr-coverage-component-${{ github.event.workflow_run.id }}
          path: coverage/component
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Codacy LCOV inputs
        run: |
          set -euo pipefail
          test -s coverage/jest/core/lcov.info
          test -s coverage/jest/web/lcov.info
          test -s coverage/jest/mobile/lcov.info
          test -s coverage/component/lcov.info

      - name: Download and verify Codacy reporter
        env:
          CODACY_REPORTER_VERSION: 14.1.3
        run: |
          set -euo pipefail
          reporter_dir="$RUNNER_TEMP/codacy-reporter/$CODACY_REPORTER_VERSION"
          reporter_name=codacy-coverage-reporter-linux
          mkdir -p "$reporter_dir"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$reporter_dir/$reporter_name" \
            "https://artifacts.codacy.com/bin/codacy-coverage-reporter/$CODACY_REPORTER_VERSION/$reporter_name"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$reporter_dir/$reporter_name.SHA512SUM" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/$CODACY_REPORTER_VERSION/$reporter_name.SHA512SUM"
          (cd "$reporter_dir" && sha512sum --check "$reporter_name.SHA512SUM")
          chmod +x "$reporter_dir/$reporter_name"

      - name: Upload coverage to Codacy
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_COMMIT_SHA: ${{ steps.pull-request-context.outputs.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/codacy-reporter/14.1.3/codacy-coverage-reporter-linux" report \
            --api-token "$CODACY_API_TOKEN" \
            --organization-provider gh \
            --username koreyba \
            --project-name EverFreeNote \
            --commit-uuid "$CODACY_COMMIT_SHA" \
            -r coverage/jest/core/lcov.info \
            -r coverage/jest/web/lcov.info \
            -r coverage/jest/mobile/lcov.info \
            -r coverage/component/lcov.info
