name: Merge tests coverage

on:
  push:
    branches: [main]

concurrency:
  group: merge-tests-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-coverage:
    name: Jest coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest coverage
        id: run-jest-coverage
        continue-on-error: true
        run: npm run test:unit:coverage

      - name: Verify Jest LCOV
        id: verify-jest-lcov
        if: always()
        run: test -s coverage/jest/lcov.info

      - name: Upload Jest coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jest-coverage-${{ github.run_id }}
          path: coverage/jest
          if-no-files-found: error
          retention-days: 14

      - name: Fail Jest coverage job when tests or report failed
        if: always() && (steps.run-jest-coverage.outcome != 'success' || steps.verify-jest-lcov.outcome != 'success')
        run: exit 1

  component-coverage:
    name: Cypress component coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/component-tests.yml
    with:
      coverage: true
      publish_allure: true
    permissions:
      actions: read
      contents: write
      checks: write
      issues: write
      pull-requests: write

  sonarqube-main:
    name: SonarQube main analysis
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit-coverage, component-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Download Jest coverage report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: jest-coverage-${{ github.run_id }}
          path: coverage/jest

      - name: Download Cypress component coverage report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: component-coverage-${{ github.run_id }}
          path: coverage/component

      - name: Verify imported LCOV reports
        if: always()
        continue-on-error: true
        run: |
          test -s coverage/jest/lcov.info
          test -s coverage/component/lcov.info

      - name: Detect available LCOV reports
        id: detect-lcov
        if: always()
        run: |
          set -euo pipefail

          reports=()
          for report in coverage/jest/lcov.info coverage/component/lcov.info; do
            if [ -s "$report" ]; then
              reports+=("$report")
            fi
          done

          if [ "${#reports[@]}" -gt 0 ]; then
            report_paths=$(IFS=,; echo "${reports[*]}")
            echo "sonar_args=-Dsonar.javascript.lcov.reportPaths=${report_paths}" >> "$GITHUB_OUTPUT"
            echo "Using LCOV reports: ${report_paths}"
          else
            echo "sonar_args=" >> "$GITHUB_OUTPUT"
            echo "No LCOV reports available; running SonarQube without coverage."
          fi

      - name: SonarQube Scan with coverage
        if: always()
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            ${{ steps.detect-lcov.outputs.sonar_args }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
