name: Qodana PR analysis

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: qodana-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana-pr:
    name: Qodana PR analysis
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana Scan without coverage
        uses: JetBrains/qodana-action@4861e015da555e86a72b862892aba6c2b93e6891
        with:
          pr-mode: true
          upload-result: true
          artifact-name: qodana-pr-${{ github.run_id }}
          args: --baseline baseline.sarif.json
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1215262580 }}
          QODANA_ENDPOINT: https://qodana.cloud
