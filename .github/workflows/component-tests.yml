name: Component Tests

on:
  push:
    branches: [develop, github-actions-setup]
  workflow_dispatch:
  workflow_call:
    inputs:
      coverage:
        description: Run Cypress component tests with coverage and upload coverage artifacts
        required: false
        default: false
        type: boolean
      publish_allure:
        description: Publish the component Allure report to GitHub Pages
        required: false
        default: true
        type: boolean
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
      SUPABASE_URL:
        required: false
      NEXT_PUBLIC_SUPABASE_ANON_KEY:
        required: false
      SUPABASE_ANON_KEY:
        required: false
      NEXT_PUBLIC_TEST_AUTH_EMAIL:
        required: false
      NEXT_PUBLIC_TEST_AUTH_PASSWORD:
        required: false
      NEXT_PUBLIC_SKIP_AUTH_EMAIL:
        required: false
      NEXT_PUBLIC_SKIP_AUTH_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  prepare-component-shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_artifact: ${{ steps.plan.outputs.plan_artifact }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Plan every component spec
        id: plan
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/component-shards.js plan --shards 4 --sha "$COMMIT_SHA" \
            --output component-shard-plan.json > "$RUNNER_TEMP/component-shard-plan.log"
          node -e 'const fs = require("node:fs"); const plan = require("./component-shard-plan.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(plan.matrix) + "\n")'
          echo "plan_artifact=component-shard-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload exact component plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.plan.outputs.plan_artifact }}
          path: component-shard-plan.json
          if-no-files-found: error
          retention-days: 30

  component-shards:
    name: Component shard ${{ matrix.shard }}
    needs: prepare-component-shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-component-shards.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Download exact component plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.prepare-component-shards.outputs.plan_artifact }}
          path: .component-plan

      - name: Select this shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          specs="$(node scripts/component-shards.js select \
            --plan .component-plan/component-shard-plan.json --shard "$SHARD_INDEX" \
            --attempt "$GITHUB_RUN_ATTEMPT" --output component-shard.json)"
          echo "COMPONENT_SPECS=$specs" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: ./node_modules/.bin/cypress install

      - name: Run component tests
        id: run-component-tests
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          COVERAGE_ENABLED: ${{ inputs.coverage == true }}
          COMPONENT_COVERAGE_DEFER_REPORT: ${{ inputs.coverage == true }}
        run: |
          mkdir -p cypress/results
          set -o pipefail
          coverage_args=()
          if [ "${COVERAGE_ENABLED}" = "true" ]; then
            coverage_args+=(--env codeCoverage=true)
          fi
          # Keep one fixture per runner and headed Electron inside Xvfb.
          # Mask commands reach GitHub, while raw artifacts receive redacted logs.
          python3 scripts/run-component-ci-isolated.py -- npm run test:component:ci -- \
            --headed --spec "$COMPONENT_SPECS" "${coverage_args[@]}" --reporter junit \
            --reporter-options "mochaFile=cypress/results/component-tests-[hash].xml,toConsole=false" 2>&1 | awk '
            { print; fflush() }
            index($0, "::add-mask::") != 1 { print >> "cypress/results/component-tests.log"; fflush("cypress/results/component-tests.log") }
          '
          exit "${PIPESTATUS[0]}"

      - name: Reconcile Cypress, JUnit, and Allure results
        if: always()
        env:
          COMPONENT_STEP_OUTCOME: ${{ steps.run-component-tests.outcome }}
        run: |
          node scripts/backfill-cypress-spec-failures-to-allure.js \
            --results-dir allure-results/component \
            --log-file cypress/results/component-tests.log \
            --junit-dir cypress/results \
            --run-outcome "${COMPONENT_STEP_OUTCOME}" \
            --summary-file "${GITHUB_STEP_SUMMARY}" \
            --screenshots-dir cypress/screenshots

      - name: Upload immutable shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: component-shard-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            component-shard.json
            allure-results/component
            cypress/results
            cypress/screenshots
            cypress/videos
            .nyc_output/out.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Mark shard as failed when component tests failed
        if: always() && steps.run-component-tests.outcome != 'success'
        run: exit 1

  component-tests:
    needs: [prepare-component-shards, component-shards]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      has_allure_results: ${{ steps.component-allure-check.outputs.has_allure_results }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download exact component plan
        if: always() && needs.prepare-component-shards.result == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.prepare-component-shards.outputs.plan_artifact }}
          path: .component-plan

      - name: Download all shard attempts
        if: always()
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: component-shard-${{ github.run_id }}-*
          path: .component-shards

      - name: Validate completeness and merge component evidence
        id: merge-component-results
        if: always()
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COVERAGE_ENABLED: ${{ inputs.coverage == true }}
        run: |
          outcome=0
          node scripts/component-shards.js merge \
            --plan .component-plan/component-shard-plan.json \
            --input .component-shards --output .component-merged \
            --sha "$COMMIT_SHA" --coverage "$COVERAGE_ENABLED" || outcome=$?
          if [ -f .component-merged/summary.json ]; then
            cat .component-merged/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$outcome"

      - name: Render complete Cypress coverage report once
        id: render-component-coverage
        if: always() && inputs.coverage == true
        run: |
          node node_modules/nyc/bin/nyc.js report \
            --temp-dir=.component-merged/.nyc_output \
            --reporter=html --reporter=text --reporter=lcov \
            --report-dir=.component-merged/coverage/component
          test -s .component-merged/coverage/component/lcov.info
          test -s .component-merged/coverage/component/index.html

      - name: Check component Allure artifacts
        id: component-allure-check
        if: always()
        run: |
          if [ -d .component-merged/allure-results/component ] && \
             [ "$(find .component-merged/allure-results/component -name '*-result.json' -type f | wc -l)" -gt 0 ]; then
            echo "has_allure_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_allure_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: component-test-results-${{ github.run_id }}
          path: .component-merged/cypress
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload component Allure artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: component-test-allure-${{ github.run_id }}
          path: |
            .component-merged/allure-results/component
            .component-merged/summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload Cypress coverage report
        if: always() && inputs.coverage == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'component-coverage' || 'pr-coverage-component' }}-${{ github.run_id }}
          path: .component-merged/coverage/component
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload Cypress raw coverage
        if: always() && inputs.coverage == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'component-coverage-raw' || 'pr-coverage-component-raw' }}-${{ github.run_id }}
          path: .component-merged/.nyc_output/out.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Fail component family when any shard, merge, or coverage report failed
        if: >-
          always() &&
          (needs.prepare-component-shards.result != 'success' ||
           needs.component-shards.result != 'success' ||
           steps.merge-component-results.outcome != 'success' ||
           (inputs.coverage == true && steps.render-component-coverage.outcome != 'success'))
        run: exit 1

  publish-component-report:
    name: Publish Component Allure report
    needs: component-tests
    if: |
      always() &&
      needs.component-tests.result != 'skipped' &&
      needs.component-tests.outputs.has_allure_results == 'true' &&
      (
        github.event_name != 'pull_request' ||
        inputs.publish_allure == true
      ) &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gh-pages-allure-publish
      cancel-in-progress: false
    permissions:
      checks: write
      contents: write
      issues: write
      pull-requests: write
    env:
      PAGES_BASE_URL: https://koreyba.github.io/EverFreeNote
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FAMILY_OUTCOME: ${{ needs.component-tests.result == 'success' && 'success' || 'failure' }}
      WORKFLOW_NAME: Component Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Download component Allure artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: component-test-allure-${{ github.run_id }}
          path: .artifacts/component

      - name: Prepare gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf .pages-existing
          git init --quiet .pages-existing
          git -C .pages-existing config user.name "github-actions[bot]"
          git -C .pages-existing config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .pages-existing remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C .pages-existing fetch --quiet --depth=1 origin gh-pages; then
            git -C .pages-existing checkout --quiet -B gh-pages FETCH_HEAD
          else
            git -C .pages-existing checkout --quiet --orphan gh-pages
            find .pages-existing -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Download allure artifacts of other suites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/download-other-workflow-artifacts.js

      - name: Restore allure history
        run: |
          set -euo pipefail

          rm -rf .allure-history
          mkdir -p .allure-history/_history

          if [ -d .pages-existing/_history/allure ]; then
            cp -R .pages-existing/_history/allure .allure-history/_history/allure
          fi

      - name: Build allure family report
        id: prepare-allure-report
        run: |
          node scripts/prepare-allure-family-report.js \
            --family allure \
            --work-dir .allure-publish/allure \
            --history-root .allure-history \
            --input core-unit=.artifacts/core/allure-results/core-unit \
            --input core-integration=.artifacts/core/allure-results/core-integration \
            --input web-unit=.artifacts/web/allure-results/web-unit \
            --input component=.artifacts/component/allure-results/component \
            --input e2e=.artifacts/e2e/allure-results/e2e \
            --github-output "$GITHUB_OUTPUT"

      - name: Update gh-pages content
        if: steps.prepare-allure-report.outputs.has_results == 'true'
        env:
          REPORT_DIR: ${{ steps.prepare-allure-report.outputs.report_dir }}
          REPORT_OUTPUT_DIR: ${{ steps.prepare-allure-report.outputs.report_output_dir }}
          HISTORY_PATH: ${{ steps.prepare-allure-report.outputs.history_path }}
          METADATA_PATH: ${{ steps.prepare-allure-report.outputs.metadata_path }}
        run: |
          set -euo pipefail

          report_dir="${REPORT_DIR}"
          report_output_dir="${REPORT_OUTPUT_DIR}"
          history_path="${HISTORY_PATH}"
          metadata_path="${METADATA_PATH}"

          rm -rf ".pages-existing/${report_dir}"
          parent_dir="$(dirname ".pages-existing/${report_dir}")"
          mkdir -p "${parent_dir}"
          cp -R "${report_output_dir}" ".pages-existing/${report_dir}"

          if [ -n "${history_path}" ] && [ -f ".allure-history/${history_path}" ]; then
            mkdir -p ".pages-existing/$(dirname "${history_path}")"
            cp ".allure-history/${history_path}" ".pages-existing/${history_path}"
          fi

          node scripts/generate-allure-report-index.js \
            --existing .pages-existing/reports/index.json \
            --current "${metadata_path}" \
            --output .pages-existing \
            --template .github/pages/allure-reports-index.html \
            --limit-per-family 20

          node scripts/prune-allure-pages.js \
            --root .pages-existing \
            --reports-list .pages-existing/reports/retained-paths.txt \
            --history-list .pages-existing/reports/retained-history-paths.txt

      - name: Push gh-pages updates
        if: steps.prepare-allure-report.outputs.has_results == 'true'
        env:
          REPORT_URL: ${{ steps.prepare-allure-report.outputs.report_url }}
        run: |
          set -euo pipefail

          if [ -n "$(git -C .pages-existing status --porcelain)" ]; then
            git -C .pages-existing add .
            git -C .pages-existing commit -m "Publish allure Allure report for run ${GITHUB_RUN_ID}"
            git -C .pages-existing push origin HEAD:gh-pages
          else
            echo "No gh-pages changes to push."
          fi

          {
            echo "## Allure Report"
            echo
            echo "- Published report: ${REPORT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR status comment
        if: github.event_name == 'pull_request' && steps.prepare-allure-report.outputs.has_results == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p .tmp-artifacts/pr-status-comment
          comment_file=".tmp-artifacts/pr-status-comment/body.md"
          payload_file=".tmp-artifacts/pr-status-comment/payload.json"

          node scripts/render-pr-status-comment.js \
            --reports-index .pages-existing/reports/index.json \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${COMMIT_SHA}" \
            --catalog-url "${PAGES_BASE_URL}/" \
            --output "${comment_file}"

          jq -n --rawfile body "${comment_file}" '{ body: $body }' > "${payload_file}"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("everfreenote-pr-status-comment"))) | .id' \
              | head -n 1
          )"

          if [ -n "${comment_id}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" --input "${payload_file}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "${payload_file}"
          fi

      - name: Allure Report Official
        if: github.event_name == 'pull_request' && steps.prepare-allure-report.outputs.has_results == 'true'
        continue-on-error: true
        uses: allure-framework/allure-action@bd0373251ed3f1c5ac9aa44ac86ed40d839b3094 # v0.8.0
        with:
          report-directory: ${{ steps.prepare-allure-report.outputs.report_output_dir }}
          remote-href: ${{ steps.prepare-allure-report.outputs.report_url }}
          sections: 'new, flaky, retry'
          github-token: ${{ secrets.GITHUB_TOKEN }}
