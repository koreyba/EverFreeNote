# Temporary diagnostic branch only. The default branch retains the normal workflow.
name: Component Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Cypress binary
        run: ./node_modules/.bin/cypress install

      - name: Run the full MobileLayout spec with coverage
        id: component
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          mkdir -p cypress/results
          python3 scripts/run-component-ci-isolated.py -- \
            ./node_modules/.bin/cypress run --component --browser electron \
            --env codeCoverage=true \
            --spec cypress/component/features/mobile/MobileLayout.cy.tsx \
            --reporter junit \
            --reporter-options "mochaFile=cypress/results/component-tests-[hash].xml,toConsole=false"

      - name: Print targeted font test results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              'dismisses the desktop font size menu after a hover with one Escape',
              'exposes the font size tooltip to keyboard users and dismisses its menu',
              'returns focus to the font size trigger when dismissed without a choice',
              'dismisses the font size menu when Escape follows a delayed tooltip',
              'uses a compact font icon while retaining the selected font in its menu',
          }
          observed = set()
          skipped = set()
          for path in sorted(Path('cypress/results').glob('component-tests-*.xml')):
              for case in ET.parse(path).iter('testcase'):
                  name = case.get('classname', '')
                  failures = case.findall('failure') + case.findall('error')
                  if name not in expected and not failures:
                      continue
                  if name in expected:
                      observed.add(name)
                  if case.findall('skipped'):
                      skipped.add(name)
                  status = 'FAILED' if failures else 'SKIPPED' if name in skipped else 'PASSED'
                  print(f'Font diagnostic: {name}: {status}', flush=True)
                  for failure in failures:
                      print(failure.get('message', ''), flush=True)
          missing = expected - observed
          if missing or skipped:
              raise SystemExit(f'Missing expected font tests: {sorted(missing)}; skipped: {sorted(skipped)}')
          trace_names = {'compact-family', 'compact-size', 'desktop-size', 'keyboard-size', 'focus-size'}
          for name in sorted(trace_names):
              path = Path('cypress/results') / f'lifecycle-{name}.json'
              if not path.exists():
                  raise SystemExit(f'Missing viewport trace: {name}')
              print(f'Viewport trace {name}: {path.read_text()}', flush=True)
          PY

      - name: Preserve the component test result
        if: steps.component.outcome != 'success'
        run: exit 1
